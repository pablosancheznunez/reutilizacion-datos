project:
  type: book
  output-dir: _book
  resources:
    - laboratorio.js
    - fuentes
    - datos
    - webr
    - webr-repo
    - plantillas
    - pdf
    - moodle
    - sw.js

book:
  title: "Reutilización de datos abiertos y documentos"
  subtitle: "Tutoriales interactivos en R (webR)"
  author:
    - name: "Pablo Sánchez-Núñez"
      orcid: 0000-0001-7845-9506
      url: https://pablosancheznunez.com
      affiliation: "Universidad Carlos III de Madrid"
  date: last-modified
  date-format: "D [de] MMMM [de] YYYY"
  language: es
  site-url: https://pablosancheznunez.com/reutilizacion-datos/
  doi: 10.5281/zenodo.24500934
  search: true
  page-navigation: true
  sidebar:
    tools:
      - icon: download
        menu:
          - text: "Libro en PDF"
            href: pdf/reutilizacion-datos-abiertos.pdf
          - text: "Libro en EPUB (lectores de libros electrónicos)"
            href: pdf/reutilizacion-datos-abiertos.epub
  page-footer:
    left: "© 2026 [Pablo Sánchez-Núñez](https://pablosancheznunez.com) · [ORCID 0000-0001-7845-9506](https://orcid.org/0000-0001-7845-9506) · Texto bajo licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)"
    right: "Universidad Carlos III de Madrid · Hecho con [Quarto](https://quarto.org) y [webR](https://docs.r-wasm.org/webr/latest/)"
  chapters:
    - index.qmd
    - 00a-primeros-pasos.qmd
    - part: "Temas"
      chapters:
        - 00-datos-abiertos.qmd
        - 01-risp.qmd
        - 02-proyectos.qmd
        - 03-calidad.qmd
        - 04-interoperabilidad.qmd
        - 05-infomediarias.qmd
        - 06-caso-practico.qmd
  appendices:
    - 90-chuleta-r.qmd
    - 91-guia-docente.qmd
    - 92-glosario.qmd

lang: es

crossref:
  chapters: false

filters:
  - webex
  - interactivos

format:
  live-html:
    theme:
      light: [cosmo, estilos.scss]
      dark: [darkly, estilos-oscuro.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    lightbox: auto
    css: fuentes/fuentes.css
    link-external-newwindow: true
    callout-appearance: simple
    include-in-header:
      - laboratorio.html
    include-after-body:
      - accesibilidad.html
      - progreso.html

webr:
  engine-url: webr/
  repos:
    - webr-repo
  packages:
    - jsonlite
  resources:
    - datos
